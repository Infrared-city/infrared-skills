<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 234" role="img" aria-labelledby="t d">
<title id="t">A vs B comparison</title>
<desc id="d">Two UTCI grids on the same cells, a baseline A and a variant B. B minus A gives a difference grid in kelvin; a polygon outlines the area of interest. From the difference grid come the mean change inside the polygon, the area above 32 degrees C and the best single cell. Notes: keep polygon, weather, time and inputs the same and change one layer; check that result.bounds match; mask NaN and building cells.</desc>
<style>
svg{--bg:#ffffff;--panel:#f3f8f8;--edge:#c8dede;--ink:#0a0f1a;--muted:#64748b;--teal:#2b7c85;--accent:#176587;--bld:#cbd5e1;--bldedge:#64748b;--sun:#d97706;--green:#3f8f4f;--pv:#1e3a5f;--sail:#e0f2fe;--hot:#dc2626;--cool:#2563eb;--mid:#f1f5f9}
@media (prefers-color-scheme:dark){svg{--bg:#0a0f1a;--panel:#111a27;--edge:#1e293b;--ink:#f8fafc;--muted:#94a3b8;--teal:#1fb5bf;--accent:#23e5e5;--bld:#334155;--bldedge:#94a3b8;--sun:#fbbf24;--green:#6fcf7f;--pv:#93c5fd;--sail:#1e3a5f;--hot:#f87171;--cool:#60a5fa;--mid:#1e293b}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--edge);stroke-width:1.5}
.h{font-size:17px;font-weight:700}.b{font-size:14px;font-weight:700}.s{font-size:13px;fill:var(--muted)}.m{font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.arrow{stroke:var(--teal);stroke-width:2.5;fill:none;marker-end:url(#ah)}
.line{stroke:var(--ink);stroke-width:1.5;fill:none}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--teal)"/></marker></defs>
<rect class="bg" width="720" height="234"/>
<text class="h" x="20" y="30">A vs B: one change, same grid</text>
<text class="b" x="20" y="62">A  baseline</text><rect x="20" y="72" width="24" height="24" fill="#f97316" stroke="var(--edge)"/><rect x="44" y="72" width="24" height="24" fill="#ef4444" stroke="var(--edge)"/><rect x="68" y="72" width="24" height="24" fill="#fb923c" stroke="var(--edge)"/><rect x="92" y="72" width="24" height="24" fill="#f97316" stroke="var(--edge)"/><rect x="20" y="96" width="24" height="24" fill="#ef4444" stroke="var(--edge)"/><rect x="44" y="96" width="24" height="24" fill="#dc2626" stroke="var(--edge)"/><rect x="68" y="96" width="24" height="24" fill="#f97316" stroke="var(--edge)"/><rect x="92" y="96" width="24" height="24" fill="#fb923c" stroke="var(--edge)"/><rect x="20" y="120" width="24" height="24" fill="#fb923c" stroke="var(--edge)"/><rect x="44" y="120" width="24" height="24" fill="#ef4444" stroke="var(--edge)"/><rect x="68" y="120" width="24" height="24" fill="#f97316" stroke="var(--edge)"/><rect x="92" y="120" width="24" height="24" fill="#fb923c" stroke="var(--edge)"/><rect x="20" y="144" width="24" height="24" fill="#f97316" stroke="var(--edge)"/><rect x="44" y="144" width="24" height="24" fill="#fb923c" stroke="var(--edge)"/><rect x="68" y="144" width="24" height="24" fill="#fbbf24" stroke="var(--edge)"/><rect x="92" y="144" width="24" height="24" fill="#f97316" stroke="var(--edge)"/>
<text class="h" x="132" y="124">-</text>
<text class="b" x="160" y="62">B  variant</text><rect x="160" y="72" width="24" height="24" fill="#f97316" stroke="var(--edge)"/><rect x="184" y="72" width="24" height="24" fill="#ef4444" stroke="var(--edge)"/><rect x="208" y="72" width="24" height="24" fill="#fb923c" stroke="var(--edge)"/><rect x="232" y="72" width="24" height="24" fill="#f97316" stroke="var(--edge)"/><rect x="160" y="96" width="24" height="24" fill="#93c5fd" stroke="var(--edge)"/><rect x="184" y="96" width="24" height="24" fill="#60a5fa" stroke="var(--edge)"/><rect x="208" y="96" width="24" height="24" fill="#fbbf24" stroke="var(--edge)"/><rect x="232" y="96" width="24" height="24" fill="#fb923c" stroke="var(--edge)"/><rect x="160" y="120" width="24" height="24" fill="#93c5fd" stroke="var(--edge)"/><rect x="184" y="120" width="24" height="24" fill="#60a5fa" stroke="var(--edge)"/><rect x="208" y="120" width="24" height="24" fill="#fbbf24" stroke="var(--edge)"/><rect x="232" y="120" width="24" height="24" fill="#fb923c" stroke="var(--edge)"/><rect x="160" y="144" width="24" height="24" fill="#f97316" stroke="var(--edge)"/><rect x="184" y="144" width="24" height="24" fill="#fb923c" stroke="var(--edge)"/><rect x="208" y="144" width="24" height="24" fill="#fbbf24" stroke="var(--edge)"/><rect x="232" y="144" width="24" height="24" fill="#f97316" stroke="var(--edge)"/>
<text class="h" x="272" y="124">=</text>
<text class="b" x="300" y="62">B - A (K)</text><rect x="300" y="72" width="24" height="24" fill="var(--mid)" stroke="var(--edge)"/><rect x="324" y="72" width="24" height="24" fill="var(--mid)" stroke="var(--edge)"/><rect x="348" y="72" width="24" height="24" fill="var(--mid)" stroke="var(--edge)"/><rect x="372" y="72" width="24" height="24" fill="var(--mid)" stroke="var(--edge)"/><rect x="300" y="96" width="24" height="24" fill="var(--cool)" stroke="var(--edge)"/><rect x="324" y="96" width="24" height="24" fill="var(--cool)" stroke="var(--edge)"/><rect x="348" y="96" width="24" height="24" fill="#93c5fd" stroke="var(--edge)"/><rect x="372" y="96" width="24" height="24" fill="var(--mid)" stroke="var(--edge)"/><rect x="300" y="120" width="24" height="24" fill="var(--cool)" stroke="var(--edge)"/><rect x="324" y="120" width="24" height="24" fill="var(--cool)" stroke="var(--edge)"/><rect x="348" y="120" width="24" height="24" fill="#93c5fd" stroke="var(--edge)"/><rect x="372" y="120" width="24" height="24" fill="var(--mid)" stroke="var(--edge)"/><rect x="300" y="144" width="24" height="24" fill="var(--mid)" stroke="var(--edge)"/><rect x="324" y="144" width="24" height="24" fill="var(--mid)" stroke="var(--edge)"/><rect x="348" y="144" width="24" height="24" fill="var(--mid)" stroke="var(--edge)"/><rect x="372" y="144" width="24" height="24" fill="var(--mid)" stroke="var(--edge)"/>
<path d="M306,78 L388,82 L392,160 L310,158 Z" fill="none" stroke="var(--ink)" stroke-width="2.5"/>
<path class="arrow" d="M404,120 L436,120"/>
<rect class="panel" x="444" y="56" width="256" height="120" rx="8"/>
<text class="m" x="456" y="80">mean(delta[inside])</text><text class="s" x="456" y="96">cooling over the polygon</text>
<text class="m" x="456" y="122">(B &gt; 32 C).sum() x 1 m2</text><text class="s" x="456" y="138">heat-stress area</text>
<text class="s" x="456" y="162">min(delta): best cell</text>
<text class="s" x="20" y="200">Same polygon, weather, time and inputs; change one layer. Check result.bounds match.</text>
<text class="s" x="20" y="218">Mask NaN and building cells. Report the polygon mean, not a single cell.</text>
</svg>
