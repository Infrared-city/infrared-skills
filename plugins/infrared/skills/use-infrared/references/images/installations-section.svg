<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 492" role="img" aria-labelledby="t d">
<title id="t">Installations in a street section</title>
<desc id="d">A street section between two buildings with the sun at the upper right. From left to right: a green climbing layer 1 m in front of the left wall, a shade sail on two posts that lets 20 percent of the light through, a person below it, an opaque PV canopy on posts, and opaque louvre fins in front of the right wall. A table below: UTCI and comfort statistics read shade and transmittance but not the wind; solar radiation and daylight read shade and transmittance and give pv_yield for pv pieces; sun hours and sky view factor treat every piece as opaque; the wind analyses do not read installations.</desc>
<style>
svg{--bg:#ffffff;--panel:#f3f8f8;--edge:#c8dede;--ink:#0a0f1a;--muted:#64748b;--teal:#2b7c85;--accent:#176587;--bld:#cbd5e1;--bldedge:#64748b;--sun:#d97706;--green:#3f8f4f;--pv:#1e3a5f;--sail:#e0f2fe;--hot:#dc2626;--cool:#2563eb;--mid:#f1f5f9}
@media (prefers-color-scheme:dark){svg{--bg:#0a0f1a;--panel:#111a27;--edge:#1e293b;--ink:#f8fafc;--muted:#94a3b8;--teal:#1fb5bf;--accent:#23e5e5;--bld:#334155;--bldedge:#94a3b8;--sun:#fbbf24;--green:#6fcf7f;--pv:#93c5fd;--sail:#1e3a5f;--hot:#f87171;--cool:#60a5fa;--mid:#1e293b}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--edge);stroke-width:1.5}
.h{font-size:17px;font-weight:700}.b{font-size:14px;font-weight:700}.s{font-size:13px;fill:var(--muted)}.m{font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.arrow{stroke:var(--teal);stroke-width:2.5;fill:none;marker-end:url(#ah)}
.line{stroke:var(--ink);stroke-width:1.5;fill:none}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--teal)"/></marker></defs>
<rect class="bg" width="720" height="492"/>
<text class="h" x="20" y="30">Installations in a street section</text>
<circle cx="566" cy="44" r="16" fill="var(--sun)"/>
<path d="M540,64 L397,330" stroke="var(--sun)" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.45"/><path d="M470,64 L320,330" stroke="var(--sun)" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.45"/><path d="M400,64 L250,330" stroke="var(--sun)" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.45"/>
<rect x="20" y="110" width="110" height="220" fill="var(--bld)" stroke="var(--bldedge)" stroke-width="1.5"/>
<rect x="600" y="90" width="100" height="240" fill="var(--bld)" stroke="var(--bldedge)" stroke-width="1.5"/>
<line x1="20" y1="330" x2="700" y2="330" stroke="var(--ink)" stroke-width="2"/>
<rect x="134" y="180" width="8" height="150" fill="var(--green)"/>
<path d="M138,190 q6,10 0,20 q-6,10 0,20 q6,10 0,20 q-6,10 0,20 q6,10 0,20 q-6,10 0,20 q6,10 0,20" stroke="var(--green)" stroke-width="2" fill="none"/>
<path d="M190,262 L320,248" stroke="var(--teal)" stroke-width="4" stroke-dasharray="10 5"/>
<line x1="190" y1="262" x2="190" y2="330" class="line"/><line x1="320" y1="248" x2="320" y2="330" class="line"/>
<rect x="400" y="268" width="130" height="7" fill="var(--pv)"/>
<line x1="410" y1="275" x2="410" y2="330" class="line"/><line x1="520" y1="275" x2="520" y2="330" class="line"/>
<rect x="574" y="150" width="18" height="5" fill="var(--bldedge)"/><rect x="574" y="184" width="18" height="5" fill="var(--bldedge)"/><rect x="574" y="218" width="18" height="5" fill="var(--bldedge)"/><rect x="574" y="252" width="18" height="5" fill="var(--bldedge)"/><rect x="574" y="286" width="18" height="5" fill="var(--bldedge)"/>
<circle cx="250" cy="300" r="5" fill="var(--ink)"/><line x1="250" y1="305" x2="250" y2="320" class="line"/><line x1="250" y1="320" x2="245" y2="330" class="line"/><line x1="250" y1="320" x2="255" y2="330" class="line"/>
<text class="b" x="150" y="160">green layer</text><text class="s" x="150" y="176">green-climbing, 1 m in</text><text class="s" x="150" y="192">front of the wall</text>
<text class="b" x="196" y="226">shade sail</text><text class="s" x="196" y="242">transmittance 0.2</text>
<text class="b" x="400" y="240">PV canopy</text><text class="s" x="400" y="256">pv, pv-efficiency 0.20</text>
<text class="b" x="470" y="136">louvres, fins</text><text class="s" x="470" y="152">opaque (metal)</text>
<rect class="panel" x="20" y="350" width="680" height="128" rx="8"/>
<text class="b" x="34" y="374">Which models see them</text>
<text class="m" x="34" y="398">UTCI, comfort statistics</text><text class="s" x="300" y="398">shade + transmittance; wind not changed (warning)</text>
<text class="m" x="34" y="418">solar radiation, daylight</text><text class="s" x="300" y="418">shade + transmittance; pv pieces give pv_yield</text>
<text class="m" x="34" y="438">sun hours, sky view factor</text><text class="s" x="300" y="438">shade, every piece opaque (material removed)</text>
<text class="m" x="34" y="458">wind speed, wind comfort</text><text class="s" x="300" y="458">not read</text>
</svg>
